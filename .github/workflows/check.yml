name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: for f in $(git ls-files '*.sh' '*/bin/*'); do head -1 "$f" | grep -q bash && { bash -n "$f" || exit 1; }; done
      - name: Python syntax
        run: python3 -m py_compile $(git ls-files '*.py')
      - name: Every module has README.md, install.sh and test.sh
        run: for d in */; do [ "$d" = .github/ ] || [ "$d" = _tests/ ] && continue; for f in README.md install.sh test.sh; do [ -f "$d$f" ] || { echo "missing $d$f"; exit 1; }; done; done
      - name: Custom nodes are pinned to a commit
        run: |
          grep -vE '^\s*(#|$)' comfyui/nodes.txt | awk 'NF < 2 || $2 !~ /^[0-9a-f]{40}$/ {print "not pinned " $0; bad=1} END {exit bad}'
      - name: Python undefined names (pyflakes)
        run: |
          pip install -q pyflakes
          python3 -m pyflakes $(git ls-files '*.py') > pf.txt || true; cat pf.txt
          ! grep -q "undefined name" pf.txt
      - name: ai gen workflows match the pinned ComfyUI node definitions
        run: python3 comfyui/check_workflows.py
      - name: Generation capability compatibility (offline)
        run: python3 -m unittest discover -s comfyui -p 'test_generation.py'
      - name: Producer JSON and real CLI parsing (offline)
        run: python3 -m unittest discover -s comfyui -p 'test_producer.py'
      - name: Inspection does not persist state
        run: python3 -m unittest discover -s comfyui -p 'test_cli_inspection.py'
      - name: Public model command dispatch
        run: bash _tests/catalogue_dispatch_test.sh
      - name: Model helper placement and data preservation (offline)
        run: python3 -m unittest discover -s comfyui -p 'test_helpers.py'
      - name: Family registry and read-only model catalogue (offline)
        run: |
          python3 -m unittest discover -s comfyui -p 'test_registry.py'
          python3 -m unittest discover -s comfyui -p 'test_catalogue.py'
      - name: Character file contracts and composition (offline)
        run: bash character/test.sh
      - name: Model files (copies, conflicts, moves)
        run: bash _tests/models_test.sh
      - name: Model acquisition requires owner consent (offline fixtures)
        run: python3 -B _tests/download_policy_test.py
      - name: Synthetic approval fixture backend (offline, not PC acceptance)
        run: python3 -B _tests/approval_fixture_test.py
      - name: Model publication and failure preservation (disposable fixtures)
        run: python3 -B -m unittest discover -s _tests -p 'publication_fixture_test.py'
      - name: Module contract (real tests, checksums for code-carrying model files)
        run: bash _tests/contract_check.sh
      - name: Rig contract and CLI (offline)
        run: bash rig/test.sh
